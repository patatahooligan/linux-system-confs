server:
    trust-anchor-file: "/etc/unbound/trusted-key.key"
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    # This automatically renews DNS entries if they are queried when
    # close to expiring. This means we will never hit the latency cost
    # for domains we query repeatedly. Unbound will still let entries
    # expire if they are not queried in time, so it does not keep stuff
    # we don't need anymore.
    prefetch: yes
python:
dynlib:
remote-control:
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 2606:4700:4700::1001@853#cloudflare-dns.com
    forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
